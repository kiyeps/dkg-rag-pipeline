name: Publish with provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC: required by npm publish --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # npm Trusted Publishing (OIDC) requires npm CLI >= 11.5.1. Node 24 ships
      # a sufficient npm, so this only upgrades when the bundled version is too
      # old; it never downgrades.
      - name: Verify npm CLI >= 11.5.1
        run: |
          set -euo pipefail
          current="$(npm --version)"
          echo "bundled npm: ${current}"
          required="11.5.1"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm ${current} is older than ${required}; upgrading"
            npm install -g npm@"$required"
            current="$(npm --version)"
          fi
          echo "effective npm: ${current}"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm ${current} still older than ${required}" >&2
            exit 1
          fi
          echo "npm >= ${required} - OK"

      - name: Install (lockfile-pinned, no scripts)
        run: npm ci --ignore-scripts

      - name: Verify no install scripts
        run: |
          node -e "
          const p = require('./package.json');
          const bad = ['preinstall','install','postinstall','prepare'].filter(k => p.scripts && p.scripts[k]);
          if (bad.length) { console.error('Install scripts present: ' + bad.join(', ')); process.exit(1); }
          console.log('No install scripts - OK');
          "

      - name: Verify LICENSE present
        run: |
          test -f LICENSE || { echo 'LICENSE missing'; exit 1; }
          node -e "
          const p = require('./package.json');
          if (!p.license) { console.error('package.json has no license field'); process.exit(1); }
          console.log('license field: ' + p.license);
          "
          head -2 LICENSE | grep -q 'Apache License' || { echo 'LICENSE is not Apache 2.0'; exit 1; }

      - name: Run tests
        run: npm test

      - name: Audit production dependencies (must be clean)
        run: npm audit --omit=dev

      - name: Publish with provenance
        run: npm publish --provenance --access public

